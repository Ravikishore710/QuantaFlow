name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Type check
        run: mypy src scripts

      - name: Run dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit --desc on || echo "pip-audit completed with warnings"

      - name: Run test suite with coverage
        run: |
          pytest tests/unit tests/contracts tests/integration tests/e2e --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: DAG import check
        run: |
          pip install apache-airflow==3.0.0
          python -c "import ast; ast.parse(open('airflow/dags/quanta_flow_monthly.py').read())"
