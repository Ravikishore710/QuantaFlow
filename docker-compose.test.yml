services:
  postgres-test:
    image: postgres:16
    container_name: quantaflow-postgres-test
    environment:
      POSTGRES_DB: quantaflow_test
      POSTGRES_USER: quantaflow_test
      POSTGRES_PASSWORD: testpassword123
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantaflow_test -d quantaflow_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:latest
    container_name: quantaflow-minio-test
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minio_test_user
      MINIO_ROOT_PASSWORD: minio_test_password123
    ports:
      - "9002:9000"
      - "9003:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10
